<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0b14">
<style>:root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Doorlist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800;900&family=DM+Sans:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: night-out poster wall. Loud gradient hero + marquee, tall neon poster cards, sticker badges, glowing tier cards, holographic ticket stubs. Dark only by choice. */
:root{
  color-scheme:dark;
  --bg:#0d0b14; --surface:#16131f; --surface2:#1e1a2b; --fg:#f3f1f8; --muted:#a39fb5; --line:#2c2740;
  /* names kept from the first pass: pink = main violet, violet = deeper violet, lime = soft warm sand, cyan = grey lilac, orange = warm amber */
  --pink:#7c5cf0; --violet:#6a4ce0; --lime:#e8b88a; --cyan:#a9a4c4; --orange:#e8a06a; --red:#e5667a; --ink:#0d0b14;
  --g-main:linear-gradient(110deg,#7c5cf0,#6a4ce0);
  --g-hot:linear-gradient(110deg,#e8a06a,#e8b88a);
  --g-cool:linear-gradient(110deg,#5a46b8,#7c5cf0);
  --display:"Unbounded","Arial Black",Impact,sans-serif;
  --body:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"DM Mono",ui-monospace,Menlo,Consolas,monospace;
  --spring:cubic-bezier(.2,.7,.3,1);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5;
  padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow-x:hidden}
.glowbg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;background:var(--bg)}
.glowbg i{position:absolute;border-radius:50%;filter:blur(90px);opacity:.38;animation:blob 18s ease-in-out infinite alternate}
.glowbg i:nth-child(1){width:46vw;height:46vw;left:-12vw;top:-10vw;background:var(--pink)}
.glowbg i:nth-child(2){width:42vw;height:42vw;right:-14vw;top:18vh;background:var(--violet);animation-delay:-6s}
.glowbg i:nth-child(3){width:38vw;height:38vw;left:25vw;bottom:-22vw;background:var(--cyan);opacity:.22;animation-delay:-11s}
@keyframes blob{to{transform:translate(6vw,5vh) scale(1.15)}}
a{color:inherit}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
.ic{width:1.1em;height:1.1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-.18em}
.wrap{position:relative;z-index:1;max-width:1160px;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 0}
.brand{font-family:var(--display);font-weight:900;font-size:22px;letter-spacing:-.03em;text-decoration:none;display:flex;align-items:center;gap:8px}
.brand .logo{width:34px;height:34px;border-radius:11px;background:var(--g-main);display:grid;place-items:center;color:var(--ink);transform:rotate(-8deg);box-shadow:0 0 22px rgba(255,61,154,.6);transition:transform .3s var(--spring)}
.brand:hover .logo{transform:rotate(8deg) scale(1.12)}
.brand span.t{background:var(--g-main);-webkit-background-clip:text;background-clip:text;color:transparent}
.nav{display:flex;align-items:center;gap:6px}
.nav a{display:inline-flex;align-items:center;gap:8px;text-decoration:none;padding:10px 14px;border-radius:12px;font-weight:700;color:var(--muted);transition:transform .25s var(--spring),background .2s,color .2s}
.nav a:hover{color:var(--fg);background:var(--surface2);transform:translateY(-2px)}
.nav a[aria-current="page"]{color:var(--ink);background:var(--g-main);box-shadow:0 0 18px rgba(255,61,154,.5)}
.count{min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--lime);color:var(--ink);font-size:12px;font-weight:800;display:inline-grid;place-items:center;box-shadow:0 0 14px rgba(182,255,59,.7)}
[hidden]{display:none!important}
.count[hidden]{display:none}
.wiggle .ic{animation:wiggle .6s ease}
.bounce{animation:bump .6s var(--spring)}
@keyframes wiggle{0%,100%{transform:rotate(0)}20%{transform:rotate(-18deg)}40%{transform:rotate(14deg)}60%{transform:rotate(-10deg)}80%{transform:rotate(6deg)}}
@keyframes bump{0%{transform:scale(1)}35%{transform:scale(1.6)}100%{transform:scale(1)}}
main{padding:10px 0 64px;min-height:70vh}
main.has-bar{padding-bottom:110px}
#app.enter{animation:viewIn .38s cubic-bezier(.2,.8,.2,1)}
@keyframes viewIn{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
.rise{animation:rise .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*60ms)}
@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
h1,h2,h3{font-family:var(--display);letter-spacing:-.03em;text-wrap:balance;margin:0}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}

/* stickers */
.sticker{--c:var(--pink);--r:-3deg;display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:12px;border:3px solid #fff;background:var(--c);color:var(--ink);font-family:var(--body);font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:.05em;transform:rotate(var(--r));box-shadow:0 5px 14px rgba(0,0,0,.5),0 0 20px color-mix(in srgb,var(--c) 55%,transparent);white-space:nowrap;line-height:1.2}
.sticker.big{font-size:14px;padding:8px 14px}
.sticker.fire .ic{animation:flame 1s ease-in-out infinite}
@keyframes flame{0%,100%{transform:scale(1) rotate(-4deg)}50%{transform:scale(1.3) rotate(5deg)}}
.float{animation:bob 4.5s ease-in-out infinite;animation-delay:calc(var(--d,0)*-1s)}
@keyframes bob{0%,100%{transform:translateY(0) rotate(var(--r,0deg))}50%{transform:translateY(-10px) rotate(calc(var(--r,0deg) + 3deg))}}
.float.sticker{animation-name:bob}

/* hero */
.hero{position:relative;padding:18px 0 6px}
.hero h1{font-size:clamp(38px,9.4vw,92px);line-height:.98;font-weight:900;letter-spacing:-.045em}
.hero h1 .w{display:inline-block;margin-right:.18em;background:linear-gradient(100deg,var(--pink),var(--orange),var(--pink),var(--violet),var(--cyan),var(--pink));background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:rise .6s cubic-bezier(.2,.8,.2,1) both,shimmer 6s linear infinite;animation-delay:calc(var(--i)*90ms),0s;filter:drop-shadow(0 0 22px rgba(255,61,154,.35))}
@keyframes shimmer{to{background-position:-300% 0}}
.hero p.lead{max-width:54ch;color:var(--muted);margin:16px 0 0;font-size:17px}
.cluster{display:flex;flex-wrap:wrap;gap:12px;margin-top:20px}
@media (min-width:980px){.cluster{position:absolute;right:0;top:10px;width:300px;display:block;margin:0;height:260px}.cluster .sticker{position:absolute}
  .cluster .sticker:nth-child(1){right:20px;top:0;--r:6deg}.cluster .sticker:nth-child(2){right:110px;top:70px;--r:-5deg}.cluster .sticker:nth-child(3){right:0;top:136px;--r:4deg}.cluster .sticker:nth-child(4){right:90px;top:206px;--r:-4deg}}
.marq{margin:28px 0 6px;overflow:hidden;border-block:2px solid var(--line);background:rgba(21,16,42,.7);transform:rotate(-1.2deg);box-shadow:0 0 28px rgba(138,92,255,.25)}
.marq .track{display:flex;width:max-content;animation:marq 26s linear infinite}
.marq span{display:inline-flex;align-items:center;gap:14px;padding:12px 14px;font-family:var(--display);font-weight:800;font-size:15px;letter-spacing:.04em;white-space:nowrap}
.marq span .ic{color:var(--lime)}
.marq span:nth-child(3n+1) b{color:var(--pink)}.marq span:nth-child(3n+2) b{color:var(--cyan)}.marq span:nth-child(3n) b{color:var(--lime)}
@keyframes marq{to{transform:translateX(-50%)}}

/* toolbar */
.toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:26px 0 12px}
.searchbox{position:relative;flex:1 1 240px;min-width:0}
.searchbox .ic{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--cyan)}
.search{width:100%;min-width:0;padding:13px 14px 13px 42px;border:2px solid var(--line);background:var(--surface);border-radius:14px;transition:border-color .2s,box-shadow .2s}
.search:focus{outline:none;border-color:var(--cyan);box-shadow:0 0 0 4px rgba(39,224,255,.2),0 0 24px rgba(39,224,255,.3)}
select.sort{padding:13px 14px;border:2px solid var(--line);background:var(--surface);border-radius:14px;cursor:pointer}
select.sort option{background:var(--surface)}
.chips{position:relative;display:flex;gap:10px;overflow-x:auto;padding:8px 6px 14px;margin:0 -6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.hl{position:absolute;top:8px;left:0;height:44px;width:80px;border-radius:999px;background:var(--g-main);box-shadow:0 0 22px var(--hc,rgba(255,61,154,.6));transition:left .35s var(--spring),width .35s var(--spring),background .3s,box-shadow .3s;z-index:0;pointer-events:none}
.hl.still{transition:none}
.chip{--c:var(--pink);position:relative;z-index:1;flex:none;display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 18px;border-radius:999px;border:2px solid color-mix(in srgb,var(--c) 55%,transparent);background:var(--surface);cursor:pointer;font-weight:700;transition:color .2s,transform .2s var(--spring),background .25s}
.chip .ic{color:var(--c);transition:color .2s}
.chip:hover{transform:translateY(-2px)}
.chip:active{transform:scale(.92)}
.chip[aria-pressed="true"]{background:transparent;color:var(--ink);border-color:transparent}
.chip[aria-pressed="true"] .ic{color:var(--ink)}
.chip.pop{animation:chipPop .5s var(--spring)}
@keyframes chipPop{0%{transform:scale(.85)}60%{transform:scale(1.14)}100%{transform:scale(1)}}

/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:22px;margin-top:8px}
.card{--rx:0deg;--ry:0deg;--ty:0px;position:relative;display:flex;flex-direction:column;text-decoration:none;background:var(--surface);border-radius:22px;border:2px solid var(--line);overflow:hidden;transform:perspective(900px) rotateX(var(--rx)) rotateY(var(--ry)) translateY(var(--ty));transition:transform .18s ease-out,box-shadow .25s,border-color .25s}
.card::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:2px;background:linear-gradient(135deg,var(--c1),var(--c2),var(--cyan));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);opacity:0;transition:opacity .25s;z-index:4;pointer-events:none}
.card:hover{--ty:-8px;box-shadow:0 18px 40px rgba(0,0,0,.5),0 0 36px color-mix(in srgb,var(--c1) 45%,transparent);border-color:transparent}
.card:hover::before{opacity:1}
.card:active{transform:scale(.98)}
.poster{--c1:#ff3d9a;--c2:#5b1bd6;position:relative;aspect-ratio:4/5;display:flex;flex-direction:column;justify-content:flex-end;padding:16px;color:#fff;overflow:hidden;background:linear-gradient(155deg,var(--c1),var(--c2));max-width:100%}
.poster.wide{aspect-ratio:16/8;border-radius:24px;padding:24px}
.poster::before{content:"";position:absolute;inset:-60px;opacity:.28;mix-blend-mode:overlay;animation:drift 14s linear infinite}
.poster.p-Parties::before{background:radial-gradient(circle,#fff 0 3px,transparent 4px) 0 0/30px 30px}
.poster.p-Concerts::before{background:repeating-linear-gradient(90deg,#fff 0 3px,transparent 3px 18px)}
.poster.p-Conferences::before{background:linear-gradient(#fff 1px,transparent 1px) 0 0/30px 30px,linear-gradient(90deg,#fff 1px,transparent 1px) 0 0/30px 30px}
.poster.p-Workshops::before{background:repeating-linear-gradient(135deg,#fff 0 3px,transparent 3px 16px)}
@keyframes drift{to{transform:translate(30px,30px)}}
.poster::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(11,8,20,.82),rgba(11,8,20,.05) 62%)}
.poster>*{position:relative;z-index:1}
.emo{position:absolute!important;left:50%;top:38%;font-size:clamp(76px,9vw,112px);line-height:1;transform:translate(-50%,-50%);filter:drop-shadow(0 8px 24px rgba(0,0,0,.45));animation:emobob 5s ease-in-out infinite;z-index:1;user-select:none}
.poster.wide .emo{left:auto;right:7%;top:50%;font-size:clamp(90px,16vw,170px);transform:translateY(-50%)}
@keyframes emobob{0%,100%{translate:0 0;rotate:-4deg}50%{translate:0 -12px;rotate:5deg}}
.poster .pt{font-family:var(--display);font-weight:900;font-size:clamp(20px,2.2vw,26px);line-height:1.05;letter-spacing:-.035em;text-shadow:0 2px 16px rgba(0,0,0,.45)}
.poster.wide .pt{font-size:clamp(28px,5vw,54px)}
.stk{position:absolute!important;top:14px;left:12px;display:flex;flex-direction:column;align-items:flex-start;gap:8px;z-index:3}
.pricetag{position:absolute!important;top:14px;right:12px;z-index:3}
.soldout .poster{filter:saturate(.35) brightness(.65)}
.stamp{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%) rotate(-16deg);z-index:5;border:4px solid var(--red);color:var(--red);font-family:var(--display);font-weight:900;font-size:clamp(22px,3vw,34px);padding:6px 18px;border-radius:12px;letter-spacing:.06em;background:rgba(11,8,20,.72);box-shadow:0 0 24px rgba(255,51,85,.5);white-space:nowrap;animation:stampIn .5s var(--spring) both}
@keyframes stampIn{from{opacity:0;transform:translate(-50%,-50%) rotate(-16deg) scale(2.2)}}
.poster>.pimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
.poster.hasimg .emo,.poster.hasimg::before{display:none}
.poster.hasimg::after{background:linear-gradient(to top,rgba(11,8,20,.9),rgba(11,8,20,0) 45%)}
.poster.wide.hasimg{aspect-ratio:auto;padding:0;background:#0d0b14;border-radius:24px}
.poster.wide.hasimg::after{display:none}
.poster.wide.hasimg>.pimg{position:relative;display:block;height:auto;max-height:640px;object-fit:contain}
.poster.wide.hasimg .pt{padding:16px 24px 22px}
.th{display:flex;gap:12px;align-items:center}
.tthumb{width:54px;height:68px;object-fit:cover;border-radius:10px;flex:none;background:var(--bg)}
.ipv{aspect-ratio:4/5;width:132px;border-radius:12px;border:1px dashed color-mix(in srgb,var(--fg,#fff) 25%,transparent);background:#15101f center/cover no-repeat;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px;text-align:center;padding:8px;flex:none}
.imgrow{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.ictl{flex:1;min-width:180px;display:flex;flex-direction:column;gap:10px}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pills label{cursor:pointer;position:relative}.pills input{position:absolute;opacity:0;width:1px;height:1px;min-height:0;padding:0;border:0;margin:0}
.pills span{display:inline-block;padding:5px 12px;border-radius:99px;border:1px solid color-mix(in srgb,var(--fg,#fff) 22%,transparent);font-size:13px}
.pills input:checked+span{background:var(--pink);border-color:var(--pink);color:#fff}
.pills input:focus-visible+span{outline:2px solid var(--pink);outline-offset:2px}
.cbody{padding:16px 16px 18px;display:flex;flex-direction:column;gap:6px;flex:1}
.row-i{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:14px;min-width:0}
.row-i .ic{color:var(--cyan)}
.row-i.when{font-family:var(--mono);font-size:13px;color:var(--fg);text-transform:uppercase;letter-spacing:.03em}
.row-i.when .ic{color:var(--pink)}
.empty{padding:48px 16px;text-align:center;color:var(--muted);border:2px dashed var(--line);border-radius:20px}

/* buttons */
.btn{display:inline-flex;justify-content:center;align-items:center;gap:9px;border:2px solid var(--line);background:var(--surface2);padding:13px 20px;min-height:48px;border-radius:14px;cursor:pointer;font-weight:800;text-decoration:none;transition:transform .35s var(--spring),box-shadow .25s,border-color .2s,filter .2s}
.btn:hover:not(:disabled){transform:translateY(-2px);border-color:var(--violet)}
.btn:active:not(:disabled){transform:scale(.9);transition-duration:.08s}
.btn.primary{background:var(--g-main);color:var(--ink);border-color:transparent;box-shadow:0 0 22px rgba(255,61,154,.5);animation:glowpulse 2.4s ease-in-out infinite}
.btn.primary:hover:not(:disabled){filter:brightness(1.12)}
.btn.lime{background:linear-gradient(110deg,var(--lime),var(--cyan));color:var(--ink);border-color:transparent;box-shadow:0 0 22px rgba(182,255,59,.4)}
.btn:disabled{opacity:.4;cursor:not-allowed;animation:none;box-shadow:none}
.btn.block{width:100%}
.btn.sm{min-height:40px;padding:8px 14px;font-size:14px}
.btn.link{border:0;background:none;padding:6px 8px;min-height:0;font-weight:600;color:var(--muted);box-shadow:none}
.btn.link:hover:not(:disabled){color:var(--red);border-color:transparent}
.iconbtn{width:46px;height:46px;padding:0;min-height:46px;border-radius:14px}
.iconbtn.fav[aria-pressed="true"]{background:var(--g-hot);color:var(--ink);border-color:transparent;box-shadow:0 0 20px rgba(255,138,43,.6)}
.iconbtn.fav[aria-pressed="true"] .ic{fill:currentColor;animation:bump .5s var(--spring)}
@keyframes glowpulse{0%,100%{box-shadow:0 0 18px rgba(255,61,154,.45)}50%{box-shadow:0 0 34px rgba(138,92,255,.85)}}

/* event page */
.back{display:inline-flex;align-items:center;gap:8px;margin-bottom:16px;color:var(--muted);text-decoration:none;font-weight:700;transition:color .2s,transform .2s var(--spring)}
.back:hover{color:var(--fg);transform:translateX(-4px)}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:32px;align-items:start}
.panel{background:linear-gradient(180deg,var(--surface),rgba(21,16,42,.9));border:2px solid var(--line);border-radius:22px;padding:20px;min-width:0}
.panel.sticky{position:sticky;top:16px;box-shadow:0 0 40px color-mix(in srgb,var(--c,var(--pink)) 25%,transparent)}
.panel h2{font-size:19px;margin-bottom:14px;display:flex;align-items:center;gap:10px}
.panel h2 .ic{color:var(--lime)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin:22px 0}
.fact{display:flex;gap:12px;align-items:flex-start;padding:14px;background:var(--surface);border:2px solid var(--line);border-radius:16px;min-width:0}
.fact .ib{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:var(--ink);background:var(--g-main);flex:none}
.fact:nth-child(2) .ib{background:var(--g-cool)}.fact:nth-child(3) .ib{background:linear-gradient(110deg,var(--lime),var(--cyan))}
.fact b{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:500}
.sched{list-style:none;margin:12px 0 0;padding:0 0 0 14px;border-left:2px dashed var(--line)}
.sched li{position:relative;display:flex;gap:14px;align-items:center;padding:10px 0 10px 18px}
.sched li::before{content:"";position:absolute;left:-23px;top:50%;width:12px;height:12px;margin-top:-6px;border-radius:50%;background:var(--c,var(--pink));box-shadow:0 0 12px var(--c,var(--pink))}
.sched time{font-family:var(--mono);font-size:13px;color:var(--cyan);min-width:84px}
.tier{position:relative;display:grid;grid-template-columns:auto 1fr auto;gap:6px 12px;padding:14px;margin-bottom:12px;background:var(--surface2);border:2px solid var(--line);border-radius:18px;align-items:center;transition:border-color .25s,box-shadow .25s,transform .3s var(--spring)}
.tier.sel{border-color:var(--c);box-shadow:0 0 0 2px var(--c),0 0 28px color-mix(in srgb,var(--c) 60%,transparent);transform:scale(1.015)}
.tier.gone{opacity:.55}
.tier .ib{width:40px;height:40px;border-radius:12px;background:var(--g-main);display:grid;place-items:center;color:var(--ink);grid-row:span 2}
.tier h3{font-size:14px;font-weight:800;letter-spacing:-.02em;line-height:1.2}
.tier .price{font-family:var(--display);font-weight:800;font-size:17px;color:var(--lime);text-shadow:0 0 14px rgba(182,255,59,.55);text-align:right}
.tier .note{grid-column:2/4;color:var(--muted);font-size:13px;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.tier .ctl{grid-column:1/4;display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:4px}
.stat{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.stat.ok{color:var(--lime)}.stat.low{color:var(--orange)}.stat.out{color:var(--red)}
.stepper{display:inline-flex;align-items:center;border:2px solid var(--line);border-radius:14px;overflow:hidden;background:var(--bg)}

/* ---- calm pass: one violet accent, one warm secondary, flat tags, almost no motion ---- */
.glowbg i{animation:none;opacity:.14;filter:blur(120px)}
.glowbg i:nth-child(3){opacity:.07}
.brand .logo{background:#7c5cf0;color:#fff;transform:none;box-shadow:none}
.brand:hover .logo{transform:none}
.brand span.t{background:none;color:var(--fg);-webkit-text-fill-color:currentColor}

.bounce{animation:softpop .3s ease-out}

#app.enter{animation:viewIn .25s ease-out}

.rise{animation:rise .4s ease-out both;animation-delay:calc(var(--i,0)*40ms)}
.eyebrow{color:var(--muted)}
/* flat tags instead of stickers */
.sticker{border:1px solid rgba(255,255,255,.14);background:rgba(13,11,20,.74);color:var(--fg);transform:none;box-shadow:none;font-size:11px;padding:4px 9px;border-radius:8px;letter-spacing:.04em;backdrop-filter:blur(6px)}
.sticker .ic{color:var(--c)}

.float{animation:none}
.hero h1{font-size:clamp(34px,8vw,76px)}
.hero h1 .w{background:none;color:var(--fg);-webkit-text-fill-color:currentColor;filter:none;animation:rise .5s ease-out both;animation-delay:calc(var(--i)*60ms)}
.hero h1 .w:last-child{color:#a68cff;-webkit-text-fill-color:#a68cff}
.cluster{position:static!important;display:flex!important;width:auto!important;height:auto!important;margin-top:18px}
.cluster .sticker{position:static!important}
/* chips */
.chip{border-color:var(--line)}
.chip .ic{color:var(--muted)}
.chip:hover{transform:none;border-color:#4a3f78}
.chip:active{transform:scale(.97)}
.chip[aria-pressed="true"]{color:#fff;border-color:transparent}
.chip[aria-pressed="true"] .ic{color:#fff}
.chip.pop{animation:none}
.hl{box-shadow:none!important;transition:left .25s ease,width .25s ease}
/* cards */
.card{transform:translateY(var(--ty));border-color:var(--line);transition:transform .2s ease,box-shadow .2s,border-color .2s}
.card::before{display:none}

function payState(ev){
  var earned=r2(salesOf(ev).rev+(ev._c?0:vendorRev(ev))),wd=0;
  st.payouts.forEach(function(x){if(x.evId===ev.id)wd+=x.amount});wd=r2(wd);
  var started=dt(ev).getTime()<=Date.now();
  var cap=ev.cancelled?wd:(started?earned:r2(earned*0.5));
  var avail=wd>earned?0:Math.max(0,r2(cap-wd));
  return{earned:earned,wd:wd,avail:avail,held:Math.max(0,r2(earned-wd-avail)),owed:Math.max(0,r2(wd-earned)),started:started,cancelled:!!ev.cancelled};
}

async function requestPayout(evId){

  if(!ev||!ev.hosted||!mineE(ev)||payBusy)return;
  if(!canW){fail("You have view-only access to this page, so you can't request payouts.");return}
  var po=st.org&&st.org.payout;
  if(!po||!po.acct){toast("Add a payout account first.");location.hash="host-profile";return}
  var ps=payState(ev),amt=r2(parseFloat(inp&&inp.value));
  if(ps.cancelled){fail("This event was cancelled, so no new withdrawals.");return}
  if(ps.owed>0){fail("You owe "+money(ps.owed)+" on this event, so withdrawals are blocked.");return}
  if(isNaN(amt)||amt<=0){fail("Enter an amount greater than $0.00.");return}
  if(amt>ps.avail){fail("You can withdraw up to "+money(ps.avail)+" now."+(ps.started?"":" Before the event starts the limit is 50% of earnings. The rest unlocks "+dLong(ev)+"."));return}
  var doc={id:"po-"+Date.now().toString(36)+Math.floor(Math.random()*1296).toString(36),evId:ev.id,host:me(),amount:amt,bank:po.bank,last4:String(po.acct).slice(-4),ts:Date.now(),status:"pending"};
  payBusy=true;
  try{
    if(dbOn)await dbRef.doc("payouts/"+doc.id).set(doc);
    if(!st.payouts.some(function(x){return x.id===doc.id}))st.payouts.unshift(doc);
    save();render();toast(money(amt)+" payout requested. It stays Pending in test mode.");

  payBusy=false;
}

async function submitReport(){
  var g=function(i){return document.getElementById(i).value.trim()},er=document.getElementById("rperr"),msg=g("rp-msg");
  if(msg.length<10){er.textContent="Tell us a little more, at least 10 characters.";return}
  if(Date.now()-lastReportAt<30000){er.textContent="You just sent one. Wait a moment before sending another.";return}
  if(!canW){er.textContent="You have view-only access to this page, so you can't send messages. Ask the owner for Contributor access.";return}
  var doc={id:"r"+Date.now().toString(36)+Math.random().toString(36).slice(2,6),kind:document.getElementById("rp-kind").value,msg:msg.slice(0,1000),contact:g("rp-contact").slice(0,80),page:reportFrom,ts:Date.now(),read:false,by:me()};
  var btn=document.querySelector("#reportform button[type=submit]");if(btn)btn.disabled=true;
  try{
    if(dbOn)await dbRef.doc("reports/"+doc.id).set(doc);
    if(!dbOn||isAdmin)st.reports=[doc].concat(st.reports.filter(function(x){return x.id!==doc.id}));
    if(!dbOn)save();
    lastReportAt=Date.now();reportSent=true;render();updateHeader();
  }catch(e){if(btn)btn.disabled=false;er.textContent="We couldn't send that. "+(e&&e.code==="invalid_argument"?"Your access level may not allow it.":"Check your connection and try again.")}
}
async function rpUpdate(id,del){
  if(!isAdmin)return;
  try{
    if(dbOn){if(del)await dbRef.doc("reports/"+id).delete();else await dbRef.doc("reports/"+id).update({read:true})}
    st.reports=del?st.reports.filter(function(x){return x.id!==id}):st.reports.map(function(x){return x.id===id?Object.assign({},x,{read:true}):x});
    if(!dbOn)save();render();updateHeader();
  }catch(e){toast("Couldn't update that message. Try again.")}
}

function dayKey(ts){var d=new Date(ts),z=function(n){return (n<10?"0":"")+n};return d.getFullYear()+"-"+z(d.getMonth()+1)+"-"+z(d.getDate())}
function countView(ev){
  if(!ev||!ev.hosted||(ev.host&&ev.host===me()))return;
  if(!dbOn&&!dbChecked)return;
  var day=dayKey(Date.now()),vk=String(me()).replace(/[^A-Za-z0-9_-]/g,"").slice(0,40),id=ev.id+"_"+vk+"_"+day;
  if(st.vseen[id])return;
  st.vseen[id]=1;
  var doc={id:id,evId:ev.id,day:day,ts:Date.now()};
  if(dbOn)dbRef.doc("views/"+id).set(doc).catch(function(){delete st.vseen[id]});
  else st.views=st.views.concat([doc]);
  save();
}
function anaData(ev){
  var views=st.views.filter(function(v){return v.evId===ev.id}).length;
  var ords=st.orders.filter(function(o){return !o.door&&o.lines.some(function(l){return l.evId===ev.id})});
  var tiers=ev.tiers.map(function(t){
    var n=0,rev=0;
    st.orders.forEach(function(o){if(o.door)return;o.lines.forEach(function(l){if(l.evId===ev.id&&l.tierId===t.id){n+=l.qty;rev+=l.qty*l.unit}})});
    st.tickets.forEach(function(k){if(k.evId===ev.id&&k.tierId===t.id&&k.status==="refunded"){n--;rev-=unitOf(k)}});
    return{name:t.name,n:Math.max(0,n),rev:Math.max(0,rev),cap:t.cap};
  });
  var N=14,today=new Date();today.setHours(0,0,0,0);
  var days=[],map={};
  for(var i=N-1;i>=0;i--){var d=new Date(today.getTime());d.setDate(d.getDate()-i);days.push({k:dayKey(d.getTime()),d:d,n:0});}
  days.forEach(function(x){map[x.k]=x});
  st.orders.forEach(function(o){if(o.door)return;o.lines.forEach(function(l){if(l.evId===ev.id){var x=map[dayKey(o.ts)];if(x)x.n+=l.qty}})});
  return{views:views,orders:ords.length,tiers:tiers,days:days};
}
function chartSVG(days,lbl){
  var max=Math.max(1,Math.max.apply(null,days.map(function(x){return x.n}))),W=280,H=70,bw=W/days.length,bars="";
  days.forEach(function(x,i){var h=Math.round(x.n/max*52);bars+='<rect x="'+(i*bw+2).toFixed(1)+'" y="'+(58-h)+'" width="'+(bw-4).toFixed(1)+'" height="'+Math.max(h,x.n?2:1)+'" rx="2" fill="'+(x.n?"var(--pink)":"var(--line)")+'"><title>'+esc(x.d.toLocaleDateString("en-US",{month:"short",day:"numeric"}))+": "+x.n+' ticket'+(x.n===1?"":"s")+'</title></rect>'});
  var tot=days.reduce(function(a,x){return a+x.n},0),f=function(x){return x.d.toLocaleDateString("en-US",{month:"short",day:"numeric"})};
  return '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+(lbl||"Tickets sold")+' per day over the last '+days.length+' days: '+tot+' in total, busiest day '+max+'">'+bars+'<text x="0" y="68">'+esc(f(days[0]))+'</text><text x="'+W+'" y="68" text-anchor="end">'+esc(f(days[days.length-1]))+'</text><text x="'+W+'" y="8" text-anchor="end">'+(tot?"busiest day: "+(max===1&&tot===0?0:max):"")+'</text></svg>';
}
function anaHTML(ev){
  var a=anaData(ev),s=salesOf(ev),conv=(a.views>0&&a.orders<=a.views)?Math.round(a.orders/a.views*100)+"%":"—";
  var tot=a.days.reduce(function(x,d){return x+d.n},0);
  return '<details class="ana" data-id="'+esc(ev.id)+'"'+(anaOpen[ev.id]?" open":"")+'><summary>'+ic("bolt")+' Analytics <span>'+a.views+' view'+(a.views===1?"":"s")+' · '+(conv==="—"?"no conversion yet":conv+" bought")+'</span></summary>'+
    '<div class="tiles"><div><b>'+a.views+'</b><span>Page views</span></div><div><b>'+s.n+'</b><span>Tickets sold</span></div><div><b>'+conv+'</b><span>Conversion</span></div></div>'+
    '<p class="fine" style="margin:0">Conversion is orders divided by page views. A visitor counts once per day, and your own views are left out.'+(a.views>0&&a.orders>a.views?' Some sales came before views were tracked, so the rate is not shown yet.':'')+'</p>'+
    '<h4>Sales by ticket type</h4>'+a.tiers.map(function(t){return '<div class="tl"><span>'+esc(t.name)+'</span><b>'+t.n+' of '+t.cap+' · '+money(t.rev)+'</b></div><div class="mini" aria-hidden="true"><i style="width:'+(t.cap?Math.min(100,Math.round(t.n/t.cap*100)):0)+'%"></i></div>'}).join("")+
    '<h4>Tickets sold, last 14 days</h4>'+(tot?chartSVG(a.days):'<p class="fine" style="margin:0">No sales in the last 14 days.</p>')+'</details>';
}

async function refundTicket(code,by){
  var tk=tkOf(code);if(!tk)return false;
  if(tk.status!=="valid"){toast(tk.status==="in"?"That ticket was already used at the door, so it can't be refunded.":tk.status==="transferred"?"That ticket was transferred. Refund the new ticket instead.":"That ticket was already refunded.");return false}
  var patch={status:"refunded",refundedAt:Date.now(),refundBy:by};
  try{
    if(dbOn)await dbRef.doc("tickets/"+code).update(patch);
    var copy=Object.assign({},tk,patch);
    st.tickets=st.tickets.map(function(x){return x.code===code?copy:x});
    if(!dbOn)save();
    return true;
  }catch(e){toast("Couldn't save that refund. "+(e&&e.code==="invalid_argument"?"Your access level may not allow it.":"Try again."));return false}
}
async function setTicket(code,status){
  var tk=tkOf(code);if(!tk)return false;
  var patch={status:status,checkedAt:status==="in"?Date.now():null,by:(staffSess()?"staff:"+st.staffCode:me())};
  try{
    if(dbOn)await dbRef.doc("tickets/"+code).update(patch);
    var copy=Object.assign({},tk,patch);
    st.tickets=st.tickets.map(function(x){return x.code===code?copy:x});
    if(!dbOn)save();
    return true;
  }catch(e){toast("Couldn't save that check-in. "+(e&&e.code==="invalid_argument"?"Your access level may not allow it.":"Try again."));return false}
}
async function doScan(raw){
  var m=String(raw||"").toUpperCase().match(/DL-[A-Z0-9]{4}-[A-Z0-9]{4}/),code=m?m[0]:String(raw||"").trim().toUpperCase();
  if(!code)return;
  var tk=tkOf(code);
  if(!tk)scanRes={kind:"bad",msg:"No ticket with that code. Check it and try again."};
  else if(tk.status==="transferred")scanRes={kind:"bad",msg:"This ticket was transferred to someone else and no longer works. Ask for their new ticket.",tk:tk};
  else if(tk.status==="refunded")scanRes={kind:"bad",msg:"This ticket was refunded, so it is no longer valid. Do not let them in.",tk:tk};
  else if(tk.evId!==scanEv){var e2=EV(tk.evId);scanRes={kind:"wrong",msg:"This ticket is for "+(e2?e2.title:"a different event")+".",tk:tk}}
  else if((EV(tk.evId)||{}).cancelled)scanRes={kind:"bad",msg:"This event was cancelled.",tk:tk};
  else if(tk.status==="in")scanRes={kind:"dup",msg:"This ticket was already used"+(tk.checkedAt?" at "+tTxt(tk.checkedAt):"")+". Do not let them in again.",tk:tk};
  else{var ok=await setTicket(code,"in");scanRes=ok?{kind:"ok",msg:"Valid ticket. Let them through.",tk:tkOf(code)}:{kind:"bad",msg:"Couldn't save that check-in. Try again."}}
  paintScan();
}
function decodePhoto(file){
  return new Promise(function(resolve){
    if(typeof jsQR==="undefined"){resolve(undefined);return}
    var url=URL.createObjectURL(file),img=new Image();
    img.onload=function(){
      var s=Math.min(1,1400/Math.max(img.width,img.height)),w=Math.max(1,Math.round(img.width*s)),h=Math.max(1,Math.round(img.height*s)),cv=document.createElement("canvas");
      cv.width=w;cv.height=h;var g=cv.getContext("2d");g.drawImage(img,0,0,w,h);URL.revokeObjectURL(url);
      var d=g.getImageData(0,0,w,h),r=jsQR(d.data,w,h);resolve(r?r.data:null);
    };
    img.onerror=function(){URL.revokeObjectURL(url);resolve(null)};
    img.src=url;
  });
}

  if(a==="csv"){var cvEv=EV(r.id);if(cvEv&&cvEv.hosted&&mineE(cvEv))downloadGuests(cvEv);return}
  if(a==="hdel"){
    var hid=b.getAttribute("data-id"),hev=EV(hid);if(!hev)return;
    if(salesOf(hev).n>0){toast("This event has sales, so it can't be deleted here.");return}
    if(hev.host&&hev.host!==me()){toast("Only the host can delete this event.");return}
    staffOf(hid).forEach(function(sf){if(dbOn)dbRef.doc("staff/"+sf.id).delete().catch(function(){})});st.staff=st.staff.filter(function(sf){return sf.evId!==hid});
    if(dbOn){dbRef.doc("events/"+hid).delete().catch(function(){});dbRef.doc("secrets/"+hid).delete().catch(function(){})}
    if(hev.img&&assetsApi)assetsApi.delete(hev.img).catch(function(){});
    delete st.secrets[hid];
    st.hosted=st.hosted.filter(function(x){return x.id!==hid});st.cart=st.cart.filter(function(l){return l.evId!==hid});delete st.codes[hid];save();render();toast("Event deleted");return}
  if(a==="imgclear"){if(pendingImg)clearImg();else if(editId)imgRemoved=true;paintImg();var fi=document.getElementById("fe-img");if(fi)fi.value="";var mm=document.getElementById("imgmsg");if(mm)mm.textContent="Image removed.";return}
  if(a==="rm"){st.cart.splice(+b.getAttribute("data-i"),1);save();render();return}
  if(a==="cinc"||a==="cdec"){
    var iL=+b.getAttribute("data-i"),l=st.cart[iL],ev3=EV(l.evId),t3=TR(ev3,l.tierId);
    l.qty=Math.max(1,Math.min(Math.min(MAXQ,left(ev3,t3)),l.qty+(a==="cinc"?1:-1)));save();popKey="c:"+iL;render();return}
  if(a==="promo"){
    var v=document.getElementById("promo").value.trim().toUpperCase();
    if(!v){st.promo="";promoMsg="";promoOk=false}
    else if(v==="DOOR10"){st.promo=v;promoMsg="10% off applied. Nice.";promoOk=true}
    else{var pck=promoCheck(v);if(pck.ok){st.promo=v;promoMsg=pck.msg;promoOk=true}else{st.promo="";promoMsg=pck.msg;promoOk=false}}
    save();render();return}
});
document.addEventListener("error",function(e){
  var t=e.target;if(!t||t.tagName!=="IMG"||!(t.classList.contains("pimg")||t.classList.contains("tthumb")))return;
  var p=t.closest(".poster");if(p)p.classList.remove("hasimg");t.remove();
},true);
document.addEventListener("submit",function(e){
  if(e.target.id==="payform"){e.preventDefault();placeOrder()}
  if(e.target.id==="optform"){e.preventDefault();optSave(e.target.getAttribute("data-o"))}
  if(e.target.id==="optoutform"){e.preventDefault();var ov=optClean(document.getElementById("oo-val").value),oer=document.getElementById("ooerr");
    if(!ov){oer.textContent="Type the email or phone number you used.";return}
    var isE=ov.indexOf("@")>-1,od=optDigits(ov),ids=st.optins.filter(function(x){return isE?String(x.email||"").toLowerCase()===ov.toLowerCase():(od.length>=6&&optDigits(x.phone)===od)}).map(function(x){return x.id});
    if(!ids.length){oer.textContent="We couldn't find anything with that. Check the spelling.";return}
    optDelete(ids).then(function(ok){if(ok){toast(ids.length+" entr"+(ids.length===1?"y":"ies")+" removed.");render()}})}
  if(e.target.id==="cityform"){e.preventDefault();cityGo(document.getElementById("cityq").value)}
  if(e.target.id==="doorform"){e.preventDefault();var dsv=EV(route().id);if(dsv)doorSale(dsv)}
  if(e.target.id&&e.target.id.indexOf("pwform-")===0){e.preventDefault();var pwe=EV(route().id),pwt=pwe&&TR(pwe,e.target.getAttribute("data-t")),pwi=document.getElementById("pw-"+e.target.getAttribute("data-t"));
    if(pwt&&pwi&&pwt.pass&&pwi.value.trim().toUpperCase()===pwt.pass){st.pw[pwe.id+":"+pwt.id]=1;save();render();toast("Unlocked")}else toast("That code doesn't match.")}
  if(e.target.id==="hostform"){e.preventDefault();createEvent()}
  if(e.target.id==="orgform"){e.preventDefault();submitOrg()}
  if(e.target.id==="staffform"){e.preventDefault();addStaff(String(route().sub||"").slice(6))}
  if(e.target.id==="staffjoinform"){e.preventDefault();var sj=document.getElementById("sc-staff"),jr=joinStaff(sj.value);if(jr.ok){scanRes=null;if(route().name==="staffjoin")location.replace("#scan");else render();toast("Signed in as door staff for "+jr.ev.title+(loggedOrg()?". Check-ins on this device now count as staff. Tap Leave to return to the organizer view.":""))}else document.getElementById("sjerr").textContent=jr.msg}
  if(e.target.id==="voteform"){e.preventDefault();vdPublish()}
  if(e.target.id==="vsform"){e.preventDefault();vsSave();return}
  if(e.target.id==="vpform"){e.preventDefault();vpPublish();return}
  if(e.target.id==="reportform"){e.preventDefault();submitReport()}
  if(e.target.id==="scanform"){e.preventDefault();var si=document.getElementById("sc-code"),sv=si.value;si.value="";doScan(sv);si.focus()}
});
document.addEventListener("keydown",function(e){if(e.key==="Enter"&&e.target.id==="code"){e.preventDefault();var cb=document.querySelector('[data-act="code"]');if(cb)cb.click()}});
document.addEventListener("input",function(e){
  if(e.target.id==="q"){filt.q=e.target.value;fillGrid()}
  if(e.target.id==="f-card"){var d=e.target.value.replace(/\D/g,"").slice(0,19);e.target.value=d.replace(/(.{4})/g,"$1 ").trim()}
});
document.addEventListener("change",function(e){
  if(e.target.id==="sort"){filt.sort=e.target.value;if(filt.sort==="near"&&!st.loc){nearLocate();return}fillGrid()}
  if(e.target.id==="rad"){filt.r=parseInt(e.target.value,10)||25;fillGrid()}
  if(e.target.name==="fe-pos")paintImg();
  if(e.target.id==="fe-img"&&e.target.files&&e.target.files[0]){
    var imf=e.target.files[0],mm2=document.getElementById("imgmsg");e.target.value="";
    if(mm2)mm2.textContent="Preparing image...";
    prepImage(imf).then(function(r){clearImg();pendingImg=r;paintImg();var m=document.getElementById("imgmsg");if(m)m.textContent="Ready: "+r.w+"x"+r.h+", "+Math.max(1,Math.round(r.blob.size/1024))+" KB after resizing."},
      function(er){var m=document.getElementById("imgmsg");if(m)m.textContent=er&&er.message==="big"?"That file is over 25 MB. Choose a smaller image.":"That doesn't look like a JPG, PNG or WebP image. Try another file."});
  }
  if(e.target.id==="sc-ev"){scanRes=null;location.hash="scan-"+e.target.value}
  if(e.target.id==="sc-photo"&&e.target.files&&e.target.files[0]){
    var f0=e.target.files[0];e.target.value="";
    decodePhoto(f0).then(function(txt){
      if(txt===undefined){toast("Photo scanning isn't available here. Type the code instead.");return}
      if(txt===null){scanRes={kind:"bad",msg:"Couldn't read a QR code in that photo. Move closer and try again, or type the code."};paintScan();return}
      doScan(txt);
    });
  }
  if(e.target.id==="fe-secret"){document.getElementById("secbox").hidden=!e.target.checked}
  if(e.target.name==="fe-access"){document.getElementById("invbox").hidden=e.target.value!=="invite"}
});
if(PATHLINKS){try{var pp=decodeURIComponent(location.pathname).replace(/^\/+|\/+$/g,"").split("/");if(pp[0]&&!/\.[a-z0-9]{2,5}$/i.test(pp[0])){history.replaceState(null,"","/");location.hash="go-"+slugClean(pp[0])+(pp[1]?"~"+pp[1]:"")}}catch(e7){}}
window.addEventListener("hashchange",render);
window.addEventListener("resize",function(){placeHL(true)});
try{if(document.fonts&&document.fonts.ready)document.fonts.ready.then(function(){placeHL(true)})}catch(e){}
render();
startDb();
})();
</script>
</html>
